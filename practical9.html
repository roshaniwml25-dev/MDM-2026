
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My To-Do List - (CM25047)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center
bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 p-4">

<div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-7">

  <div class="text-center mb-6">
    <div class="text-5xl">📝</div>
    <h1 class="text-3xl font-bold text-gray-800">My To-Do List</h1>
    <p class="text-gray-500">Organize your day ✨</p>
  </div>

  <div class="flex gap-2 mb-5">
    <input id="input" placeholder="What needs to be done?"
      class="flex-1 px-4 py-3 rounded-xl border
      focus:outline-none focus:ring-2 focus:ring-purple-400">
    <button onclick="add()"
      class="bg-purple-600 hover:bg-purple-700 text-white px-5 rounded-xl">
      Add
    </button>
  </div>

  <div class="flex justify-between text-sm mb-1">
    <span>Progress</span><span id="percent">0%</span>
  </div>
  <div class="h-2 bg-gray-200 rounded-full mb-5">
    <div id="bar" class="h-2 bg-purple-600 rounded-full"
      style="width:0%"></div>
  </div>

  <div class="flex justify-between mb-3">
    <b>Today's Tasks</b>
    <span id="count" class="bg-purple-100 text-purple-600 px-3 rounded-full">
      0 tasks
    </span>
  </div>

  <ul id="list" class="space-y-3"></ul>
  <p id="empty" class="text-center text-gray-400 py-6">
    No tasks yet. Add your first task! 🌟
  </p>

</div>

<script>
const input=document.getElementById("input"),
list=document.getElementById("list");

function add(){
  let task=input.value.trim();
  if(!task)return alert("Please enter a task!");

  list.innerHTML+=`
  <li class="flex items-center gap-3 bg-gray-50 p-3 rounded-xl shadow-sm">
    <button onclick="done(this)"
      class="check w-7 h-7 rounded-full border-2 border-purple-500">✓</button>
    <span class="task flex-1">${task}</span>
    <button onclick="del(this)" class="text-red-500 text-xl">🗑</button>
  </li>`;

  input.value=""; update();
}

function done(btn){
  btn.nextElementSibling.classList.toggle("line-through");
  btn.nextElementSibling.classList.toggle("text-gray-400");
  btn.classList.toggle("bg-purple-600");
  update();
}

function del(btn){
  btn.parentElement.remove(); update();
}

function update(){
  let total=list.children.length,
      done=document.querySelectorAll(".line-through").length,
      p=total?Math.round(done/total*100):0;

  document.getElementById("count").textContent=total+" task"+(total!=1?"s":"");
  document.getElementById("percent").textContent=p+"%";
  document.getElementById("bar").style.width=p+"%";
  document.getElementById("empty").style.display=total?"none":"block";
}

input.onkeypress=e=>{if(e.key=="Enter")add()};
</script>

</body>
</html>
